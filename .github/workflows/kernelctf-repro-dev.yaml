name: kernelCTF repro dev

'on':
  workflow_dispatch:
    inputs:
      submissionDir:
        description: Submission directory under pocs/linux/kernelctf
        type: string
        required: true
      targets:
        description: Optional comma-separated target list; leave empty to auto-detect from exploit/
        type: string
        required: false
      runs:
        description: Number of reproduction attempts per target
        type: number
        required: false
        default: 3

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      submission_dir: ${{ steps.prepare.outputs.submission_dir }}
      targets: ${{ steps.prepare.outputs.targets }}
      exploits_info: ${{ steps.prepare.outputs.exploits_info }}
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v6

      - id: prepare
        name: Resolve targets and exploit metadata
        env:
          INPUT_SUBMISSION_DIR: ${{ inputs.submissionDir }}
          INPUT_TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail

          submission_dir="$INPUT_SUBMISSION_DIR"
          submission_root="pocs/linux/kernelctf/$submission_dir"

          if [[ ! -d "$submission_root/exploit" ]]; then
            echo "Submission directory not found: $submission_root" >&2
            exit 1
          fi

          if [[ -n "$INPUT_TARGETS" ]]; then
            targets_csv="$INPUT_TARGETS"
          else
            mapfile -t discovered_targets < <(
              find "$submission_root/exploit" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
                | grep -v '^extra-' \
                | sort
            )

            if [[ ${#discovered_targets[@]} -eq 0 ]]; then
              echo "No exploit targets found under $submission_root/exploit" >&2
              exit 1
            fi

            IFS=,
            targets_csv="${discovered_targets[*]}"
            unset IFS
          fi

          export targets_csv

          echo "submission_dir=$submission_dir" >> "$GITHUB_OUTPUT"

            printf '%s\n' \
            'import json' \
            'import os' \
            'import sys' \
            '' \
            'submission_dir = os.environ["INPUT_SUBMISSION_DIR"]' \
            'targets_csv = os.environ["targets_csv"]' \
            'submission_root = os.path.join("pocs", "linux", "kernelctf", submission_dir)' \
            'metadata_path = os.path.join(submission_root, "metadata.json")' \
            'targets = [target.strip() for target in targets_csv.split(",") if target.strip()]' \
            'metadata = {}' \
            '' \
            'if os.path.exists(metadata_path):' \
            '    try:' \
            '        with open(metadata_path, "r", encoding="utf-8") as metadata_file:' \
            '            metadata = json.load(metadata_file)' \
            '    except Exception as exc:' \
            '        print(f"Ignoring metadata.json parse failure: {exc}", file=sys.stderr)' \
            '' \
            'exploit_metadata = metadata.get("exploits", {}) if isinstance(metadata, dict) else {}' \
            'exploits_info = {}' \
            'for target in targets:' \
            '    target_metadata = exploit_metadata.get(target, {}) if isinstance(exploit_metadata, dict) else {}' \
            '    if not isinstance(target_metadata, dict):' \
            '        target_metadata = {}' \
            '    exploits_info[target] = {' \
            '        "uses": target_metadata.get("uses", []),' \
            '        "requires_separate_kaslr_leak": bool(target_metadata.get("requires_separate_kaslr_leak", False)),' \
            '        "flag_time": target_metadata.get("flag_time", "1970-01-01"),' \
            '    }' \
            '' \
            'print(f"targets={json.dumps(targets)}")' \
            'print(f"exploits_info={json.dumps(exploits_info)}")' \
            > /tmp/kernelctf_repro_prepare.py

            python3 /tmp/kernelctf_repro_prepare.py >> "$GITHUB_OUTPUT"
        shell: bash

  exploit_repro_dev:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    needs: prepare
    permissions: {}
    strategy:
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
      fail-fast: false
    env:
      RELEASE_ID: ${{ matrix.target }}
      SUBMISSION_DIR: ${{ needs.prepare.outputs.submission_dir }}
      EXPLOIT_DIR: pocs/linux/kernelctf/${{ needs.prepare.outputs.submission_dir }}/exploit/${{ matrix.target }}
      EXPLOIT_INFO: ${{ toJSON(fromJSON(needs.prepare.outputs.exploits_info)[matrix.target]) }}
      RUNS: ${{ inputs.runs }}
    defaults:
      run:
        shell: bash
        working-directory: ./kernelctf/repro
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v6

      - name: Install Android dependencies for exploit build
        if: startsWith(matrix.target, 'android')
        run: bash ../../kernelctf/server/get_android_dependencies.sh --exploit-build-only

      - name: Install Linux build and repro dependencies
        if: startsWith(matrix.target, 'android') == false
        timeout-minutes: 10
        run: |
          packages=(libkeyutils-dev qemu-system-x86 inotify-tools expect)
          if ! command -v jq >/dev/null 2>&1; then
            packages+=(jq)
          fi
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${packages[@]}"

      - name: Install kernelXDK
        if: startsWith(matrix.target, 'android') == false
        run: |
          wget https://github.com/google/kernel-research/releases/download/libxdk%2Fv0.1/libxdk-v0.1.tar.gz
          tar -xzvf libxdk-v0.1.tar.gz
          chmod -R o+rx include lib
          sudo cp -R include/* /usr/local/include/
          sudo cp -R lib/* /usr/lib/

      - name: Build exploit
        working-directory: ${{ env.EXPLOIT_DIR }}
        run: |
          if make -n prerequisites; then
            make prerequisites
          fi
          make exploit

      - name: Stage exploit for repro
        run: |
          mkdir -p ./exp
          cp ../../${EXPLOIT_DIR}/exploit ./exp/exploit
          chmod +x ./exp/exploit

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Fetch Linux repro images
        if: startsWith(matrix.target, 'android') == false
        run: |
          wget -q -O rootfs.img.gz https://storage.googleapis.com/kernelctf-build/files/rootfs_repro_v2.img.gz
          gzip -d rootfs.img.gz
          download_release_id="$RELEASE_ID"
          if [[ "$download_release_id" == "mitigation-6.1" ]]; then
            download_release_id="mitigation-6.1-v2"
          fi
          wget -q  https://storage.googleapis.com/kernelctf-build/releases/$download_release_id/bzImage

      - name: Load Android kernel modules
        if: startsWith(matrix.target, 'android')
        run: |
          sudo modprobe vhost_net
          sudo modprobe vhost_vsock

      - name: Install Android repro dependencies
        if: startsWith(matrix.target, 'android')
        run: bash ../install_android_deps.sh

      - name: Set Android repro paths
        if: startsWith(matrix.target, 'android')
        run: |
          echo "APK_PATH=$(realpath ./apk/app-release.apk)" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_PATH=$(realpath ./android_release)" >> "$GITHUB_ENV"

      - id: repro_attempts
        name: Run reproduction attempts
        run: |
          set -uo pipefail

          success_count=0
          run_markers=""
          attempts_report="attempts_report.tsv"
          : > "$attempts_report"

          for attempt in $(seq 1 "$RUNS"); do
            echo "Starting reproduction $attempt / $RUNS"
            start_time=$(date +%s)
            if timeout 300s ./repro.sh "$attempt"; then
              attempt_status="success"
              success_count=$((success_count + 1))
              run_markers="$run_markers ✅"
            else
              attempt_status="failed"
              run_markers="$run_markers ❌"
            fi

            end_time=$(date +%s)
            duration=$((end_time - start_time))
            warning_present="no"
            if [[ -f "repro_log_$attempt.txt" ]] && grep -Fq "[WARNING] kernel image offset > 4GB, nperm may fail" "repro_log_$attempt.txt"; then
              warning_present="yes"
            fi
            printf '%s\t%s\t%s\t%s\n' "$attempt" "$attempt_status" "$duration" "$warning_present" >> "$attempts_report"
          done

          reliability=$((success_count * 100 / RUNS))
          {
            echo "success_count=$success_count"
            echo "reliability=$reliability"
            echo "run_markers=$run_markers"
          } >> "$GITHUB_OUTPUT"

        shell: bash

      - name: Publish reproduction summary
        if: always()
        run: |
          cpu_info_source=""
          for attempt in $(seq 1 "$RUNS"); do
            if [[ -f "repro_log_$attempt.txt" ]]; then
              cpu_info_source="repro_log_$attempt.txt"
              break
            fi
          done

          {
            echo "# Reproduction summary"
            echo
            echo "Target: $RELEASE_ID"
            echo
            echo "Reliability: ${{ steps.repro_attempts.outputs.reliability }}%"
            echo
            echo "Runs:${{ steps.repro_attempts.outputs.run_markers }}"
            echo

            if [[ -n "$cpu_info_source" ]]; then
              echo "## CPU"
              echo
              echo "| Field | Value |"
              echo "| --- | --- |"
              for pattern in \
                "Vendor:" \
                "Model:" \
                "Family:" \
                "Model ID:" \
                "Stepping:" \
                "meltdown:"; do
                line=$(grep -m1 "^$pattern" "$cpu_info_source" | tr -d '\r' || true)
                if [[ -n "$line" ]]; then
                  key=${line%%:*}
                  value=${line#*:}
                  value=${value# }
                  value=$(printf '%s' "$value" | sed 's/[[:space:]]*$//; s/|/\\\\|/g')
                  echo "| $key | $value |"
                fi
              done
              echo
            fi

            if [[ -f attempts_report.tsv ]]; then
              echo "## Per-run details"
              echo
              echo "| Run | Duration | Status | Warning |"
              echo "| --- | --- | --- | --- |"
              while IFS=$'\t' read -r attempt status duration warning_present; do
                echo "| $attempt | ${duration}s | $status | $warning_present |"
              done < attempts_report.tsv
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash

      - id: failed_logs
        name: Collect failed repro logs
        if: always()
        run: |
          failed_logs_dir="failed_repro_logs"
          rm -rf "$failed_logs_dir"
          mkdir -p "$failed_logs_dir"

          failed_count=0
          if [[ -f attempts_report.tsv ]]; then
            while IFS=$'\t' read -r attempt status duration warning_present; do
              if [[ "$status" != "failed" ]]; then
                continue
              fi

              if [[ -f "repro_log_$attempt.txt" ]]; then
                cp "repro_log_$attempt.txt" "$failed_logs_dir/"
                failed_count=$((failed_count + 1))
              fi
            done < attempts_report.tsv
          fi

          {
            echo "failed_count=$failed_count"
            if [[ "$failed_count" -gt 0 ]]; then
              echo "has_failed_logs=true"
            else
              echo "has_failed_logs=false"
            fi
          } >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Upload failed repro logs artifact
        if: always() && steps.failed_logs.outputs.has_failed_logs == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: failed_repro_logs_${{ env.RELEASE_ID }}
          path: |
            kernelctf/repro/failed_repro_logs/
          if-no-files-found: error

      - name: Fail job if reproduction never succeeded
        if: always()
        run: |
          if [[ "${{ steps.repro_attempts.outputs.success_count }}" -eq 0 ]]; then
            echo "Reproduction failed in all $RUNS attempts." >&2
            exit 1
          fi
        shell: bash
